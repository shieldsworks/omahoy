[package]
name = "omahoy"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Omahoy setup: one boat file, and a machine that matches it"
license = "MIT"
repository = "https://github.com/shieldsworks/omahoy"
homepage = "https://omahoy.org"
# The site is served from site/ and is no part of the program.
exclude = ["site/", "scripts/", "tests/", ".cursor/"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
