name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify
        run: scripts/verify.sh
      - name: Verification left the tree clean
        run: |
          status=$(git status --porcelain --untracked-files=all)
          [ -z "$status" ] || { printf '%s\n' "$status"; exit 1; }
